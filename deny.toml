# cargo-deny: run in CI by the Quality workflow (`cargo deny check`).

[graph]
all-features = false

[advisories]
# RustSec advisories fail the build; unmaintained crates are reported too.
yanked = "deny"

[licenses]
# Permissive licenses compatible with distributing MIT-licensed binaries.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
