[package]
name = "firebird-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The Firebird command line: read and edit a Firebird website from scripts and AI agents"
license = "MIT"
repository = "https://github.com/RealGeeks/firebird-cli"
readme = "README.md"
keywords = ["real-estate", "cms", "cli", "ai-agents", "firebird"]
categories = ["command-line-utilities"]
include = ["/src", "/docs/GUIDE.md", "/README.md", "/LICENSE"]

[lib]
name = "firebird_cli"
path = "src/lib.rs"

[[bin]]
name = "firebird-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
dirs = "7"
thiserror = "2"
url = "2"
comfy-table = "8"
sha2 = "0.11"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
mockito = "1.6"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
